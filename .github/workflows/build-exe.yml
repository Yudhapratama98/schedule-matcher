name: Build Windows Installer & EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        run: |
          pytest -v

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller schedule-matcher.spec

      - name: Smoke test EXE
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\schedule-matcher.exe" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Seconds 1
            try {
              $resp = Invoke-WebRequest -Uri "http://127.0.0.1:8000/api/health" -UseBasicParsing -TimeoutSec 2
              if ($resp.StatusCode -eq 200) {
                $ok = $true
                break
              }
            } catch {}
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) {
            Write-Error "EXE failed health check"
            exit 1
          }
          Write-Host "EXE smoke test passed!"

      - name: Build Windows Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $inno = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $inno)) {
              choco install innosetup -y --no-progress
            }
          }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue)?.Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc installer.iss

      - name: Upload Installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: schedule-matcher-windows-installer
          path: |
            dist/ScheduleMatcherSetup.exe
            dist/schedule-matcher.exe
